<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Chatbot | CodeAlpha</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbot {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .header {
            padding: 25px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 7px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
        }

        .chat-area {
            height: 420px;
            overflow-y: auto;
            padding: 25px;
            background: #f8fafc;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
        }

        .bot .bubble {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 5px;
        }

        .user .bubble {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #e2e8f0;
            background: white;
        }

        #questionInput {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        #questionInput:focus {
            border-color: #4f46e5;
        }

        #sendBtn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 0 22px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn:hover {
            background: #4338ca;
        }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 12px;
            color: #64748b;
            background: white;
        }

        @media (max-width: 600px) {
            .chat-area {
                height: 380px;
            }

            .bubble {
                max-width: 85%;
            }

            #sendBtn {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

    <div class="chatbot">

        <div class="header">
            <h1>🤖 FAQ Chatbot</h1>
            <p>Ask questions and get answers instantly</p>

            <div class="status">
                <span class="dot"></span>
                <span>AI Assistant Online</span>
            </div>
        </div>

        <div class="chat-area" id="chatArea">

            <div class="message bot">
                <div class="bubble">
                    Hello! 👋 I'm your FAQ Assistant.
                    Ask me a question about CodeAlpha, internships,
                    Artificial Intelligence, or Machine Learning.
                </div>
            </div>

        </div>

        <div class="input-area">
            <input
                type="text"
                id="questionInput"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button id="sendBtn">Send</button>
        </div>

        <div class="footer">
            CodeAlpha AI Internship — Task 2
        </div>

    </div>

    <script>
        const questionInput = document.getElementById("questionInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatArea = document.getElementById("chatArea");

        function addMessage(message, type) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${type}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = message;

            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);

            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendQuestion() {

            const question = questionInput.value.trim();

            if (!question) {
                return;
            }

            addMessage(question, "user");

            questionInput.value = "";

            addMessage("Thinking...", "bot");

            try {

                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                // Remove "Thinking..."
                const messages = chatArea.querySelectorAll(".message");
                const lastMessage = messages[messages.length - 1];

                if (
                    lastMessage &&
                    lastMessage.classList.contains("bot") &&
                    lastMessage.textContent === "Thinking..."
                ) {
                    lastMessage.remove();
                }

                addMessage(data.answer, "bot");

            } catch (error) {

                const messages = chatArea.querySelectorAll(".message");
                const lastMessage = messages[messages.length - 1];

                if (lastMessage) {
                    lastMessage.remove();
                }

                addMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot"
                );
            }
        }

        sendBtn.addEventListener("click", sendQuestion);

        questionInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendQuestion();
            }
        });
    </script>

</body>
</html>
